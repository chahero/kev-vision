[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev-vision"
version = "0.1.0"
description = "Experimental image-conditioned Kev decisions on Qwen3.5 and vLLM"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.30.0",
    "transformers==5.17.0",
]

[project.entry-points."vllm.general_plugins"]
kev_vision = "kev_vision:register"

[tool.setuptools.packages.find]
where = ["."]
include = ["kev_vision*"]
